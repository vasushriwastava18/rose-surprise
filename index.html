
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Rose For You 🌹</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030205;
  color: white;
  font-family: Georgia, serif;
  overflow: hidden;
}

.app {
  height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 12px;
  text-align: center;
}

h1 {
  color: #e9a2b5;
  font-size: clamp(25px, 7vw, 38px);
  text-shadow: 0 0 20px #8d173a;
}

.subtitle {
  color: #c7a8b5;
  margin: 10px 0;
  font-size: 15px;
}

canvas {
  width: min(94vw, 500px);
  height: min(66vh, 570px);
  display: block;
}

button {
  border: 1px solid #b72e56;
  background: linear-gradient(135deg,#650c2b,#b41e4c);
  color: white;
  padding: 14px 30px;
  border-radius: 40px;
  font-size: 16px;
  margin-top: 10px;
}

#message {
  color: #edb4c5;
  margin-top: 14px;
  opacity: 0;
  transition: opacity 2s;
}
</style>
</head>

<body>

<div class="app">

<h1>A Rose For You 🌹</h1>

<div class="subtitle">
A little beauty, made just for you...
</div>

<canvas id="canvas"></canvas>

<button onclick="startAnimation()">
Create My Rose 🌹
</button>

<div id="message">
Some feelings are as beautiful as a rose. ❤️
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const image = new Image();
image.src = "rose.png";

let particles = [];
let running = false;
let startTime = 0;
let width, height, dpr;
let frameId;

function resize() {

  const rect = canvas.getBoundingClientRect();

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  width = rect.width;
  height = rect.height;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function prepareParticles() {

  resize();

  const off = document.createElement("canvas");

  off.width = 400;
  off.height = 520;

  const octx = off.getContext("2d", {
    willReadFrequently: true
  });

  const scale = Math.min(
    370 / image.width,
    500 / image.height
  );

  const iw = image.width * scale;
  const ih = image.height * scale;

  const ox = (400 - iw) / 2;
  const oy = (520 - ih) / 2;

  octx.clearRect(0,0,400,520);
  octx.drawImage(image,ox,oy,iw,ih);

  const data = octx.getImageData(
    0,0,400,520
  ).data;

  particles = [];

  const screenScale = Math.min(
    width / 400,
    height / 520
  );

  const offsetX = (width - 400 * screenScale)/2;
  const offsetY = (height - 520 * screenScale)/2;

  for(let y=0;y<520;y+=3) {

    for(let x=0;x<400;x+=3) {

      const i=(y*400+x)*4;

      if(data[i+3] > 100) {

        const tx=offsetX+x*screenScale;
        const ty=offsetY+y*screenScale;

        particles.push({

          x:Math.random()*width,
          y:Math.random()*height,

          tx,
          ty,

          r:data[i],
          g:data[i+1],
          b:data[i+2],

          size:Math.random()*1.1+0.8,

          delay:Math.random()*0.7

        });

      }
    }
  }

}

function draw(t) {

  if(!running) return;

  ctx.clearRect(0,0,width,height);

  const elapsed=(t-startTime)/1000;

  let finished=true;

  particles.forEach(p=>{

    const progress=Math.max(
      0,
      Math.min(1,(elapsed-p.delay)/4)
    );

    const ease=1-Math.pow(1-progress,3);

    const bloom=0.88+0.12*ease;

    const centerX=width/2;
    const centerY=height/2;

    const targetX=centerX+(p.tx-centerX)*bloom;
    const targetY=centerY+(p.ty-centerY)*bloom;

    const spread=1-ease;

    p.x+=(targetX-p.x)*0.055;
    p.y+=(targetY-p.y)*0.055;

    if(spread>0.01) finished=false;

    const glow=progress*12;

    ctx.beginPath();

    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;

    ctx.shadowBlur=glow;
    ctx.shadowColor=`rgb(${p.r},${p.g},${p.b})`;

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.shadowBlur=0;

  if(finished) {
    document.getElementById("message").style.opacity=1;
  }

  frameId=requestAnimationFrame(draw);
}

function startAnimation() {

  if(!image.complete || !image.naturalWidth) {
    alert("Rose image is still loading. Please wait.");
    return;
  }

  cancelAnimationFrame(frameId);

  document.getElementById("message").style.opacity=0;

  prepareParticles();

  startTime=performance.now();
  running=true;

  draw(startTime);
}

image.onload=()=>{

  prepareParticles();

  startAnimation();

};

image.onerror=()=>{

  alert("rose.png not found. Please upload it to your repository.");

};

window.addEventListener("resize",()=>{

  if(image.complete && image.naturalWidth) {
    prepareParticles();
  }

});

</script>

</body>
</html>
